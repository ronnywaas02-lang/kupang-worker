<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kerja Kupang - Cari Tukang & Tenaga Kerja Terpercaya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .gradient-bg { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.15); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 pb-20">

    <header class="gradient-bg text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🌐</span>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Kerja Kupang</h1>
                    <p class="text-xs text-blue-200">Portal Tenaga Kerja Kupang & Sekitarnya</p>
                </div>
            </div>
            <div class="flex items-center flex-wrap gap-2.5">
                <a href="register-pekerja.html" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold px-3 py-2 rounded-xl transition-all shadow flex items-center gap-1.5">
                    <i class="fa-solid fa-user-plus"></i> Daftar Jadi Tukang
                </a>
            </div>
        </div>
    </header>

    <section class="bg-blue-900 text-blue-100 py-6 px-4 text-center border-b border-blue-800">
        <div class="max-w-3xl mx-auto">
            <h2 class="text-xl md:text-2xl font-bold text-white mb-2">Cari Tukang & Tenaga Kerja Harian di Kupang</h2>
            <p class="text-sm text-blue-200 mb-4">Hubungi langsung pekerja lokal terpercaya.</p>
            
            <!-- Kotak Pencarian Skill -->
            <div class="relative max-w-xl mx-auto">
                <input type="text" id="searchSkill" placeholder="Cari keahlian (contoh: Tukang Cat, Sopir, ART)..." class="w-full bg-white/10 border border-blue-700 text-white placeholder-blue-300 text-sm rounded-xl px-4 py-3 pl-10 focus:outline-none focus:bg-white/20 focus:border-white transition-all">
                <i class="fa-solid fa-search absolute left-3.5 top-3.5 text-blue-300"></i>
            </div>
        </div>
    </section>

    <main class="max-w-6xl mx-auto px-4 pt-6">
        <div id="workerGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-12 text-slate-500">
                <i class="fa-solid fa-spinner fa-spin text-3xl text-blue-600 mb-3"></i>
                <p class="text-sm font-medium">Memuat data pekerja...</p>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://hxjundgbquybpralwlrj.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4anVuZGdicXV5YnByYWx3bHJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2MDc2MzgsImV4cCI6MjEwMDE4MzYzOH0.ONX-_q_rU84BDN7GSQvVJNZSVkcC88qjcDxXVllWjp8";

        let allWorkers = [];

        async function fetchWorkers() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/workers?select=*`, {
                    headers: {
                        "apikey": SUPABASE_ANON_KEY,
                        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });
                allWorkers = await res.json();
                renderWorkers(allWorkers);
            } catch(e) { console.error(e); }
        }

        function renderWorkers(data) {
            const grid = document.getElementById('workerGrid');
            if(!data || data.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-12 text-slate-400">Tidak ada pekerja yang ditemukan.</div>';
                return;
            }
            grid.innerHTML = data.map(w => {
                let skillsArr = w.skills;
                if (typeof skillsArr === 'string') {
                    try { skillsArr = JSON.parse(skillsArr); } catch(e) { skillsArr = [w.skills]; }
                }
                const skillsHtml = Array.isArray(skillsArr) ? skillsArr.map(s => `<span class="bg-blue-50 text-blue-700 text-[10px] font-semibold px-2 py-0.5 rounded-md">${s}</span>`).join('') : '';

                return `
                    <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm card-hover flex flex-col justify-between">
                        <div>
                            <div class="flex items-center gap-3 mb-3">
                                <img src="${w.photo_url || 'https://via.placeholder.com/150'}" alt="${w.full_name}" class="w-12 h-12 rounded-full object-cover border border-slate-200 shadow-sm">
                                <div>
                                    <h3 class="font-bold text-slate-900 text-base leading-tight">${w.full_name}</h3>
                                    <p class="text-xs text-slate-500">${w.sub_region || ''}, ${w.region || ''}</p>
                                </div>
                            </div>
                            <div class="flex flex-wrap gap-1 mb-3">
                                ${skillsHtml}
                            </div>
                            ${w.description ? `<p class="text-xs text-slate-600 mb-3 italic">"${w.description}"</p>` : ''}
                            <p class="text-xs text-emerald-600 font-bold mb-3">Tarif: Rp ${parseInt(w.rate_amount || 0).toLocaleString('id-ID')} / ${w.rate_unit || 'Hari'}</p>
                        </div>
                        <a href="https://wa.me/${w.whatsapp}" target="_blank" class="block text-center bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-xl text-xs transition-all mt-2">
                            <i class="fa-brands fa-whatsapp"></i> Hubungi WhatsApp
                        </a>
                    </div>
                `;
            }).join('');
        }

        // Fitur Pencarian Real-time
        document.getElementById('searchSkill').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const filtered = allWorkers.filter(w => {
                let skillsStr = Array.isArray(w.skills) ? w.skills.join(' ') : (w.skills || '');
                let nameStr = w.full_name || '';
                return skillsStr.toLowerCase().includes(keyword) || nameStr.toLowerCase().includes(keyword);
            });
            renderWorkers(filtered);
        });

        fetchWorkers();
    </script>
</body>
</html>
