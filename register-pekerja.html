<body class="bg-slate-100 min-h-screen p-4 flex justify-center items-center font-sans">

        <!-- Form Pendaftaran -->

                <input type="text" id="fullName" required placeholder="Contoh: Anton Benu"

            <!-- WhatsApp -->

                       class="w-full mt-1 p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
            </div>

            <!-- Lokasi Wilayah & Kecamatan -->
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-sm font-semibold text-slate-700">Wilayah *</label>
                    <select id="region" required class="w-full mt-1 p-3 border border-slate-300 rounded-lg bg-white text-sm">
                        <option value="Kota Kupang">Kota Kupang</option>
                        <option value="Kabupaten Kupang">Kab. Kupang</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700">Kecamatan *</label>

            <!-- Pilihan Keahlian -->
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Pilih Keahlian Utama *</label>
                <div class="grid grid-cols-2 gap-2 text-xs mb-3">
                    <label class="flex items-center gap-2 p-2 border rounded-lg cursor-pointer bg-slate-50"><input type="checkbox" name="skill" value="Tukang Cat"> Tukang Cat</label>
                    <label class="flex items-center gap-2 p-2 border rounded-lg cursor-pointer bg-slate-50"><input type="checkbox" name="skill" value="Tukang Keramik"> Tukang Keramik</label>

                    <label class="flex items-center gap-2 p-2 border rounded-lg cursor-pointer bg-slate-50"><input type="checkbox" name="skill" value="Pasang Batako"> Pasang Batako</label>
                    <label class="flex items-center gap-2 p-2 border rounded-lg cursor-pointer bg-slate-50"><input type="checkbox" name="skill" value="Tukang Kayu"> Tukang Kayu</label>
                    <label class="flex items-center gap-2 p-2 border rounded-lg cursor-pointer bg-slate-50"><input type="checkbox" name="skill" value="Tukang Masak"> Tukang Masak</label>
                    <label class="flex items-center gap-2 p-2 border rounded-lg cursor-pointer bg-slate-50"><input type="checkbox" name="skill" value="Tukang Bangunan"> Tukang Bangunan</label>
                    <label class="flex items-center gap-2 p-2 border rounded-lg cursor-pointer bg-slate-50"><input type="checkbox" name="skill" value="Tukang Kebun"> Tukang Kebun</label>
                    <label class="flex items-center gap-2 p-2 border rounded-lg cursor-pointer bg-slate-50"><input type="checkbox" name="skill" value="ART"> ART / Asisten</label>
                    <label class="flex items-center gap-2 p-2 border rounded-lg cursor-pointer bg-slate-50"><input type="checkbox" name="skill" value="Supir"> Supir / Driver</label>

                <!-- Kolom Keahlian Lainnya -->

                    <label class="block text-[11px] font-semibold text-slate-500 mb-1">Keahlian Lainnya (Jika belum ada di atas):</label>

                           class="w-full p-2.5 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>
            
            <!-- Tarif/Gaji -->
            <div>
                <label class="block text-sm font-semibold text-slate-700">Ekspektasi Tarif / Gaji *</label>
                <div class="flex gap-2 mt-1">
                    <input type="number" id="rateAmount" required placeholder="150000" 
                           class="w-2/3 p-3 border border-slate-300 rounded-lg text-sm">

                    <input type="checkbox" id="isNegotiable" checked class="rounded text-blue-600">
                    Harga Bisa Dinegosiasikan (Bisa Nego)

            <div>
                <label class="block text-sm font-semibold text-slate-700">Ceritakan Pengalaman Singkat</label>
                <textarea id="experience" rows="2" placeholder="Contoh: Pengalaman 3 tahun tukang cat rumah, hasil rapi."

            </div>

            <!-- Foto Diri -->
            <div>
                <label class="block text-sm font-semibold text-slate-700">Foto Diri / Pas Foto *</label>
                <input type="file" id="photo" accept="image/*" required class="w-full mt-1 text-sm text-slate-500">
            </div>

            <!-- Tombol Kirim -->
            <button type="submit" id="submitBtn" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded-xl transition-all shadow-md mt-4 text-sm">
                🚀 Daftarkan Profil Saya
            </button>

        <!-- Pesan Berhasil -->
        <div id="successMsg" class="hidden text-center p-4 bg-green-100 text-green-700 rounded-xl mt-4 text-sm">
            🎉 <b>Pendaftaran Berhasil!</b> <br> 
            Data Kaka sudah tersimpan. Halaman akan dimuat ulang...
        </div>

        <div class="mt-4 text-center">
            <a href="index.php" class="text-xs text-blue-600 font-bold hover:underline">← Kembali ke Beranda</a>
        </div>
    </div>

    <!-- Script Proses Upload & Simpan -->
    <script>
        document.getElementById('workerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Proses Menyimpan...";
            btn.disabled = true;

            try {
                const skills = Array.from(document.querySelectorAll('input[name="skill"]:checked')).map(cb => cb.value);
                const otherSkillVal = document.getElementById('otherSkill').value.trim();

                if (otherSkillVal !== '') {
                    const customSkills = otherSkillVal.split(',').map(s => s.trim()).filter(s => s.length > 0);
                    skills.push(...customSkills);
                }

                if (skills.length === 0) {
                    alert("Harap pilih minimal 1 keahlian atau isi kolom keahlian lainnya!");
                    btn.innerText = "🚀 Daftarkan Profil Saya";
                    btn.disabled = false;
                    return;
                }

                const file = document.getElementById('photo').files[0];
                const fileExt = file.name.split('.').pop();
                const fileName = `${Date.now()}.${fileExt}`;
                
                const { data: uploadData, error: uploadError } = await supabaseClient
                    .storage
                    .from('worker-photos')
                    .upload(fileName, file);

                if (uploadError) throw uploadError;

                const { data: photoUrlData } = supabaseClient
                    .storage
                    .from('worker-photos')
                    .getPublicUrl(fileName);

                const { error: insertError } = await supabaseClient
                    .from('workers')
                    .insert([{
                        full_name: document.getElementById('fullName').value,
                        whatsapp: document.getElementById('whatsapp').value,
                        region: document.getElementById('region').value,
                        sub_region: document.getElementById('subRegion').value,
                        skills: skills,
                        rate_amount: document.getElementById('rateAmount').value,
                        rate_unit: document.getElementById('rateUnit').value,
                        is_negotiable: document.getElementById('isNegotiable').checked,
                        experience: document.getElementById('experience').value,
                        photo_url: photoUrlData.publicUrl
                    }]);

                if (insertError) throw insertError;

                document.getElementById('workerForm').classList.add('hidden');
                document.getElementById('successMsg').classList.remove('hidden');

                setTimeout(() => {
                    window.location.href = "index.php";
                }, 2000);

            } catch (err) {
                alert("Gagal daftar: " + err.message);
                btn.innerText = "🚀 Daftarkan Profil Saya";
                btn.disabled = false;
            }
        });
    </script>
